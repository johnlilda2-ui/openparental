name: Dependency vulnerability remediation

on:
  push:
    branches:
      - feature/openparental-web-dashboard
    paths:
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - '.github/workflows/dependency-remediation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v5
        with:
          ref: feature/openparental-web-dashboard
          token: \${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies
        working-directory: backend
        run: npm ci

      - name: Apply non-breaking security updates
        working-directory: backend
        run: npm audit fix || echo "Some advisories require manual review; validating compatible updates already applied."

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Verify backend build
        working-directory: backend
        run: npm run build

      - name: Verify backend tests
        working-directory: backend
        run: npm test -- --runInBand

      - name: Report remaining advisories
        working-directory: backend
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = require('/tmp/npm-audit.json');
          const totals = audit.metadata?.vulnerabilities ?? {};
          const rows = Object.entries(audit.vulnerabilities ?? {});
          const lines = [
            '# Backend dependency audit',
            '',
            'Generated by the dependency-remediation workflow after applying compatible updates.',
            '',
            '**Remaining vulnerability totals:** ' + JSON.stringify(totals),
            '',
            '| Package | Severity | Affected range | Fix available |',
            '|---|---|---|---|',
            ...rows.map(([name, item]) => '| ' + name + ' | ' + item.severity + ' | ' + (item.range ?? 'not reported') + ' | ' + JSON.stringify(item.fixAvailable ?? false) + ' |'),
            '',
            'Review advisories before using breaking upgrades. Do not use npm audit fix --force automatically.',
            ''
          ];
          fs.writeFileSync('SECURITY_AUDIT_REPORT.md', lines.join('\n'));
          console.log('Remaining dependency advisories:', JSON.stringify(totals));
          for (const [name, item] of rows) console.log(name + ': ' + item.severity + '; fix=' + JSON.stringify(item.fixAvailable));
          NODE

      - name: Commit verified lockfile updates and audit report
        run: |
          if ! git diff --quiet -- backend/package-lock.json backend/SECURITY_AUDIT_REPORT.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add backend/package-lock.json backend/SECURITY_AUDIT_REPORT.md
            git commit -m "security: record audit and apply verified dependency updates"
            git push origin HEAD:feature/openparental-web-dashboard
          else
            echo "No report or compatible lockfile changes were produced."
          fi
