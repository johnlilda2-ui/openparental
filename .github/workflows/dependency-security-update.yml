name: Dependency security update

# This one-time maintenance workflow applies npm's compatible fixes to the
# backend lockfile. It runs only on the audited maintenance branch (never on
# pull_request events), validates the resolved tree, then commits only the
# lockfile after build and tests pass.
on:
  push:
    branches: ['feature/android-fresh-location-command']

permissions:
  contents: write

jobs:
  update-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[auto-deps]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Apply compatible audit fixes
        run: npm audit fix --package-lock-only --no-fund --no-progress
      - name: Install patched dependency tree
        run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test
      - name: Report remaining high and critical advisories
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          let report;
          try {
            report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          } catch {
            console.log('Could not decode npm audit output; build and tests passed but audit details need manual inspection.');
            process.exit(0);
          }
          console.log('NPM audit severity summary:', JSON.stringify(report.metadata?.vulnerabilities ?? {}));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            if (item.severity === 'high' || item.severity === 'critical') {
              console.log(JSON.stringify({
                package: name,
                severity: item.severity,
                direct: item.isDirect,
                installedRange: item.range,
                fixAvailable: item.fixAvailable,
                dependents: item.effects,
                advisories: (item.via ?? [])
                  .filter(v => typeof v === 'object')
                  .map(v => ({ title: v.title, url: v.url, range: v.range })),
              }));
            }
          }
          NODE
      - name: Commit the validated lockfile changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No compatible lockfile updates were generated."
            exit 0
          fi
          git commit -m "chore(deps): apply non-breaking npm audit fixes [auto-deps]"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "HEAD:$TARGET_BRANCH"
